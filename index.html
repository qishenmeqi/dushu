<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<meta name="description" content="拍一页书，念给你听">
<title>读书</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="读书">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232f6b55'/%3E%3Cpath d='M24 32h20c6 0 10 3 10 7v33c0-4-4-7-10-7H24z' fill='%23fff'/%3E%3Cpath d='M76 32H56c-6 0-10 3-10 7v33c0-4 4-7 10-7h20z' fill='%23fff' fill-opacity='.75'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <div class="brand">读书</div>
  <div class="top-actions">
    <button id="btnSettings" class="icon-btn" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M4 7h9M17.5 7H20M4 17h3M11.5 17H20"/>
        <circle cx="15" cy="7" r="2.2"/>
        <circle cx="9" cy="17" r="2.2"/>
      </svg>
    </button>
  </div>
</header>

<main class="wrap">

  <section id="emptyState" class="empty">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6.5C10.4 5.4 8.4 4.9 6 4.9c-1 0-1.9.1-2.7.4v13.2c.8-.3 1.7-.4 2.7-.4 2.4 0 4.4.9 6 2 1.6-1.1 3.6-2 6-2 1 0 1.9.1 2.7.4V5.3c-.8-.3-1.7-.4-2.7-.4-2.4 0-4.4.5-6 1.6Z"/>
        <path d="M12 6.5v13"/>
      </svg>
    </div>
    <h1>拍一页，念给你听</h1>
    <p class="empty-desc">对着书页拍一张照片，原样显示在屏幕上。点图上任意一句，就从那里开始读。有插图的页面也照样显示，读的是图上的字。</p>
    <button id="btnAddEmpty" class="primary">拍一页</button>
    <p class="tip">识别全部在这台设备上完成，照片不会上传。第一次识别要多花几秒把识别引擎加载进来，之后就快了。</p>
  </section>

  <section id="readingState" class="reading hidden">
    <div class="page-actions">
      <button id="btnAddMore" class="ghost small">＋ 加一页</button>
      <button id="btnDict" class="ghost small">查词</button>
      <span id="pageCount" class="muted small"></span>
    </div>

    <article id="textView" class="text-view"></article>

    <div id="editWrap" class="edit-wrap hidden">
      <textarea id="editArea" spellcheck="false" aria-label="编辑识别出来的文字"></textarea>
      <div class="edit-actions">
        <button id="btnEditCancel" class="ghost">取消</button>
        <button id="btnEditSave" class="primary">保存修改</button>
      </div>
    </div>
  </section>

</main>

<div id="player" class="player hidden">
  <div class="player-inner">
    <button id="btnPrev" class="round-btn" title="上一句" aria-label="上一句">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6z"/><path d="M20 5v14L9 12z"/></svg>
    </button>
    <button id="btnPlay" class="play-btn" title="播放" aria-label="播放">
      <svg id="playIconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg>
      <svg id="playIconPause" class="hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></svg>
    </button>
    <button id="btnNext" class="round-btn" title="下一句" aria-label="下一句">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2z"/><path d="M4 5v14l11-7z"/></svg>
    </button>
  </div>
  <div class="player-status">
    <span id="posText">0 / 0</span>
    <span class="dot">·</span>
    <span id="rateText">1.0 倍</span>
  </div>
</div>

<button id="selQueryBtn" class="sel-query hidden" type="button">查</button>

<div id="dictSheet" class="sheet hidden">
  <div class="sheet-card dict-card" role="dialog" aria-label="查词">
    <div class="sheet-head">
      <h2>查词</h2>
      <button id="btnCloseDict" class="icon-btn" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="dict-search">
      <input id="dictInput" type="text" placeholder="输入一个字或词" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button id="btnDictMic" class="mic-btn" title="语音输入" aria-label="语音输入">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
        </svg>
      </button>
      <button id="btnDictGo" class="primary dict-go">查</button>
    </div>

    <div id="dictResult" class="dict-result">
      <p class="dict-hint">输入一个词查意思和读音。也可以直接长按图上的字，会查那个字或包含它的词。</p>
    </div>
  </div>
</div>

<div id="settings" class="sheet hidden">
  <div class="sheet-card" role="dialog" aria-label="设置">
    <div class="sheet-head">
      <h2>设置</h2>
      <button id="btnCloseSettings" class="icon-btn" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="row">
      <span class="row-label">朗读声音</span>
      <span class="voice-fixed">华言 · 离线女声</span>
    </div>

    <label class="row">
      <span class="row-label">语速 <b id="rateVal">1.0</b></span>
      <input id="rateRange" type="range" min="0.5" max="2" step="0.1" value="1">
    </label>

    <label class="row">
      <span class="row-label">音量 <b id="volVal">100%</b></span>
      <input id="volRange" type="range" min="0" max="1" step="0.05" value="1">
    </label>

    <label class="row toggle-row">
      <span class="row-label">朗读时滚到当前句</span>
      <input id="autoScroll" type="checkbox" checked>
    </label>

    <div class="sheet-actions">
      <button id="btnCopy" class="ghost">复制文字</button>
      <button id="btnDownload" class="ghost">下载 txt</button>
      <button id="btnClear" class="danger">清空全部</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay hidden">
  <div class="overlay-card">
    <div class="spinner"></div>
    <p id="overlayTitle" class="overlay-title">正在识别</p>
    <p id="overlaySub" class="overlay-sub"></p>
    <div class="bar"><div id="barFill" class="bar-fill"></div></div>
    <button id="btnCancelOcr" class="ghost">取消</button>
  </div>
</div>

<input id="fileInput" type="file" accept="image/*" multiple hidden>

<script src="vendor/pinyin-pro.js"></script>
<script src="vendor/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
